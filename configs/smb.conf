# Samba configuration for the home file server.
# Applies to: Ubuntu Server 26.04 LTS, Samba standalone server.

[global]
   workgroup = WORKGROUP
   netbios name = FILESERVER
   server string = Family NAS
   server role = standalone server
   security = user
   passdb backend = tdbsam
   map to guest = never
   guest account = nobody
   restrict anonymous = 2
   obey pam restrictions = no
   unix password sync = no
   pam password change = no
   server min protocol = SMB3_00
   client min protocol = SMB3_00
   follow symlinks = yes
   wide links = no
   hosts allow = 192.168.100.0/24 127.0.0.1
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 1
   use sendfile = yes
   min receivefile size = 16384
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   show add printer wizard = no

[Shared]
   comment = Family Shared Storage
   path = /srv/data/shared
   browseable = yes
   read only = no
   guest ok = no
   valid users = @family
   force group = family
   create mask = 0660
   force create mode = 0660
   directory mask = 2770
   force directory mode = 2770
   inherit acls = yes
   hide unreadable = yes
   veto files = /Thumbs.db/desktop.ini/.DS_Store/._*/.Spotlight-V100/.Trashes/
   delete veto files = yes
   vfs objects = recycle
   recycle:repository = .recycle/%U
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:exclude = *.tmp|*.temp|~*
   recycle:maxsize = 0
   # Soft-close toggle written by the pre-outage shutdown script.
   include = /run/samba-availability.conf

[Personal]
   comment = Private folder for %U
   path = /srv/data/personal/%U
   browseable = yes
   read only = no
   guest ok = no
   valid users = %U
   hide unreadable = yes
   hide dot files = yes
   create mask = 0600
   directory mask = 0700
   force create mode = 0600
   force directory mode = 0700
   vfs objects = recycle
   recycle:repository = .recycle/%U
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:exclude = *.tmp|*.temp|~*
   recycle:maxsize = 0
   # Soft-close toggle written by the pre-outage shutdown script.
   include = /run/samba-availability.conf
